# Radar tuning thresholds (P2c: policy lives in config, not code).
[market]
min_advantage = 0.80   # predicted must be >=20% under the incumbent bar
quality_floor = 0.90   # candidate iq >= 0.9x the family incumbent's
speed_multiple = 3.0   # skip when prior ttft > 3x the incumbent's
fallback_w_in = 0.75   # input-token weight when no billed mix is known

# Dated-snapshot tails -> board family they rank inside (P2c: from
