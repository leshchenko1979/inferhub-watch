name: Watch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: inferhub-watch-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate site without calling InferHub
        run: python3 site/generate.py
        env:
          PAGES_BASE: /inferhub-watch
      - name: Contract unit tests
        run: python3 -m unittest discover -s . -q

  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Probe InferHub
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.run
      - name: Probe pricing
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.pricing
      - name: Probe catalog
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.catalog
      - name: Commit run JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs
          test ! -f data/pricing.json || git add data/pricing.json
          test ! -d data/pricing || git add data/pricing
          test ! -f data/catalog.json || git add data/catalog.json
          test ! -f data/proven.json || git add data/proven.json
          if git diff --cached --quiet; then
            echo "no new run files"
          else
            git commit -m "data: inferhub run [skip ci]"
            # Rebase right before pushing, retry once: when schedule and a
            # manual dispatch overlap, the later finisher must not lose its
            # run JSON to a non-fast-forward push.
            git pull --rebase origin main
            git push || { git pull --rebase origin main && git push; }
          fi

  pages:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.repository == 'leshchenko1979/inferhub-watch'
    needs: [probe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate site
        run: python3 site/generate.py
        env:
          PAGES_BASE: /inferhub-watch
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
