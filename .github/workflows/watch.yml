name: Watch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: inferhub-watch-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate site without calling InferHub
        run: python3 site/generate.py
        env:
          PAGES_BASE: /inferhub-watch
      - name: Contract unit tests
        run: python3 -m unittest discover -s . -q

  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe InferHub
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.run
      - name: Probe pricing
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.pricing
      - name: Commit run JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs
          test ! -f data/pricing.json || git add data/pricing.json
          test ! -d data/pricing || git add data/pricing
          test ! -f data/proven.json || git add data/proven.json
          if git diff --cached --quiet; then
            echo "no new run files"
          else
            git commit -m "data: inferhub run [skip ci]"
            git push
          fi

  pages:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.repository == 'leshchenko1979/inferhub-watch'
    needs: [probe]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate site
        run: python3 site/generate.py
        env:
          PAGES_BASE: /inferhub-watch
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
