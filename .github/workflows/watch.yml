name: Watch

# Display-only run title so each run self-describes its trigger: a green push
# run ("site deploy") never probes, so it must not be mistaken for the sweep.
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Watch — sweep'
    || github.event_name == 'workflow_dispatch' && 'Watch — manual sweep'
    || github.event_name == 'pull_request' && 'Watch — validate'
    || 'Watch — site deploy'
  }}

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  # P1b: ONE group across every trigger. A schedule run and a manual
  # dispatch probing at the same time double-bill the InferHub balance and
  # race their data commits — later trigger queues instead.
  group: inferhub-watch
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate site without calling InferHub
        run: pip install -q -r requirements.txt && python3 site/generate.py
        env:
          PAGES_BASE: /inferhub-watch
      - name: Contract unit tests
        run: python3 -m unittest discover -s . -q

  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # psycopg2 is imported lazily by probe/pgstore.py. Without it the
      # Postgres path cannot be reached at all, which is how Finding B (#27)
      # stayed invisible: the builder silently used the 12k-row API cap and
      # still declared `range: 30d`.
      - name: Install probe dependencies
        run: pip install -q "psycopg2-binary>=2.9,<3"
      # Finding B fix (owner ruling 2026-09-12: "CI credential for PG"). The
      # runner opens its OWN tunnel to the usage-log cache — never the
      # unmanaged manual process on the agents box. The key is a dedicated,
      # server-side-restricted CI identity (restrict,port-forwarding,
      # permitopen="127.0.0.1:5432",command="/bin/false"): it can forward to
      # Postgres and nothing else, and it cannot run a command.
      - name: Open the Postgres tunnel (full 30d window)
        env:
          PG_CI_SSH_KEY: ${{ secrets.PG_CI_SSH_KEY }}
          PG_CI_SSH_HOST: ${{ secrets.PG_CI_SSH_HOST }}
          PG_CI_SSH_USER: ${{ secrets.PG_CI_SSH_USER }}
          PG_CI_DB_USER: ${{ secrets.PG_CI_DB_USER }}
          PG_CI_DB_PASSWORD: ${{ secrets.PG_CI_DB_PASSWORD }}
        run: |
          set -eu
          if [ -z "${PG_CI_SSH_KEY:-}" ]; then
            echo "::warning::PG_CI_SSH_KEY is not set — pricing will fall back to the 12k-row Management API cap and the artifact will declare its TRUE (short) window with row_source=api."
            exit 0
          fi
          keyfile="$RUNNER_TEMP/ci_pg_key"
          printf '%s\n' "$PG_CI_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -H "$PG_CI_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -f -N -o ExitOnForwardFailure=yes -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes -o BatchMode=yes -i "$keyfile" \
              -L 15432:127.0.0.1:5432 "$PG_CI_SSH_USER@$PG_CI_SSH_HOST"
          pid=$(pgrep -f "[s]sh .*-L 15432:127.0.0.1:5432" | head -1)
          echo "tunnel open (pid $pid): 127.0.0.1:15432 -> $PG_CI_SSH_HOST:5432"
          echo "TUNNEL_PID=$pid" >> "$GITHUB_ENV"
          python3 -c 'import sys, psycopg2; c = psycopg2.connect(host="127.0.0.1", port=15432, dbname="inferhub_logs", user=sys.argv[1], password=sys.argv[2], connect_timeout=15); k = c.cursor(); k.execute("select count(*) from usage_logs"); print("tunnel ready: usage_logs =", k.fetchone()[0], "rows"); c.close()' "$PG_CI_DB_USER" "$PG_CI_DB_PASSWORD"
          {
            echo "PGHOST=127.0.0.1"
            echo "PGPORT=15432"
            echo "PGDATABASE=inferhub_logs"
            echo "PGUSER=$PG_CI_DB_USER"
            echo "PGPASSWORD=$PG_CI_DB_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Probe InferHub
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.run
      - name: Probe pricing
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.pricing
      - name: Probe catalog
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: python3 -m probe.catalog
      - name: Probe intelligence
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 -m probe.intelligence
      - name: Commit run JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs
          test ! -f data/pricing.json || git add data/pricing.json
          test ! -d data/pricing || git add data/pricing
          test ! -f data/catalog.json || git add data/catalog.json
          test ! -f data/intelligence.json || git add data/intelligence.json
          test ! -f data/proven.json || git add data/proven.json
          if git diff --cached --quiet; then
            echo "no new run files"
          else
            git commit -m "data: inferhub run [skip ci]"
            # Rebase right before pushing, retry once: when schedule and a
            # manual dispatch overlap, the later finisher must not lose its
            # run JSON to a non-fast-forward push.
            git pull --rebase origin main
            git push || { git pull --rebase origin main && git push; }
          fi
      # Always, even when a probe step failed: a leaked forward or key file
      # must not outlive the job. The pattern is bracketed so the shell's own
      # command line cannot match itself.
      - name: Close the tunnel and remove the key
        if: always()
        run: |
          if [ -n "${TUNNEL_PID:-}" ]; then kill "$TUNNEL_PID" 2>/dev/null || true; fi
          pkill -f "[s]sh .*-L 15432:127.0.0.1:5432" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ci_pg_key"
          echo "tunnel closed, key removed"

  pages:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.repository == 'leshchenko1979/inferhub-watch'
    needs: [probe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate site
        run: pip install -q -r requirements.txt && python3 site/generate.py
        env:
          PAGES_BASE: /inferhub-watch
          FRESHNESS_FAIL: "1"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
